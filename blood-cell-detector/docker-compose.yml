services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: blood_cell_api
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=/app/models/yolo_detect_classify/best.pt
    volumes:
      - ./models:/app/models:ro
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: blood_cell_gradio
    ports:
      - "7860:7860"
    environment:
      - API_URL=http://api:8000/predict
      - GRADIO_SERVER_NAME=0.0.0.0
    depends_on:
      - api
    restart: unless-stopped
